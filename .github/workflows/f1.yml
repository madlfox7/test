name: Daily Script Runner

on:
  schedule:
    - cron: "0 3   *"  # Runs daily at 3:00 AM UTC (7:00 AM AMT)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Run Script
        run: |
          echo "Running automate_report.sh script"
          ./automate_report.sh  # Ensure the script is executable and in your repository
